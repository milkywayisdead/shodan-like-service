services:
  web:
    image: app_web_v2
    expose:
      - 8000
    command: >
      sh -c "python manage.py makemigrations &&
          python manage.py migrate &&
          gunicorn service.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./.env_test
    networks:
      - ohaiyou
  gw:
    image: app_nginx_v2
    expose: 
      - 80
    depends_on:
      - web
    networks:
      - ohaiyou
  redis:
    image: redis
    networks:
      - ohaiyou
  ui:
    image: app_ui_v2
    ports:
      - 8002:80
    networks:
      - ohaiyou

networks:
  ohaiyou:
    name: ohaiyou
