services:
  web:
    image: app_web_v2
    ports:
      - 1337:8000
    command: >
      sh -c "python manage.py makemigrations &&
          python manage.py migrate &&
          gunicorn service.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - ./.env_test
  redis:
    image: redis
    ports:
      - 6379:6379
  ui:
    image: app_ui_v2
    ports:
      - 1338:80